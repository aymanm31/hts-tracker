name: HTS Daily Check

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily — adjust to your preferred time
  workflow_dispatch: {} # lets you manually trigger a run from the GitHub UI too

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test USITC connectivity #debug lines
        run: curl -v --max-time 30 "https://hts.usitc.gov/reststop/exportList?from=0101&to=0105&format=JSON&styles=true" #debug lines

      - name: Run HTS check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python -m scripts.run_check
